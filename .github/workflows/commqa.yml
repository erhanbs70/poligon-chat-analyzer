name: CommQA — Rating & Tag Sheets
on:
  schedule:
    # Sofya 04:07 (birincil) — yaz saati (UTC+3, Nis-Eki yaklaşık): 01:07 UTC
    # NOT (4 Eyl 2026): dakika 30'dan 07'ye kaydırıldı — GitHub Actions
    # resmi dokümantasyonu, saatin yuvarlak dakikalarında (00/15/30/45)
    # yoğunluk yüzünden scheduled run'ların saatlerce gecikebileceğini
    # belirtiyor. Bu repo'daki geçmiş run'lar (07:46, 10:27, 11:08, 10:32
    # gibi hedeften saatlerce sapan saatler) tam bu paterni gösteriyordu.
    - cron: '7 1 * 4-10 *'
    # Sofya 05:07 (yedek/retry) — yaz saati: 02:07 UTC
    - cron: '7 2 * 4-10 *'
    # Sofya 04:07 (birincil) — kış saati (UTC+2, Kas-Mar yaklaşık): 02:07 UTC
    - cron: '7 2 * 11,12,1,2,3 *'
    # Sofya 05:07 (yedek/retry) — kış saati: 03:07 UTC
    - cron: '7 3 * 11,12,1,2,3 *'
  workflow_dispatch:          # Manuel çalıştırma butonu — her zaman çalışır, atlanmaz
permissions:
  contents: read
  actions: read              # gh run list için gerekli
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Bugün zaten başarılı bir run var mı kontrol et
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # DÜZELTME (4 Eyl 2026): bu job'da actions/checkout YOK, yani
          # çalışma dizininde .git yok — GH_REPO olmadan `gh run list`
          # hangi repo'da olduğunu bulamıyor ("not a git repository"
          # hatasıyla başarısız oluyordu, run #88'de görüldü).
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manuel tetikleme — doğrudan çalışacak."
            exit 0
          fi
          TODAY_SOFIA=$(TZ="Europe/Sofia" date +%F)
          LATEST_SUCCESS_AT=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --status success \
            --event schedule \
            --limit 5 \
            --json createdAt \
            --jq '.[0].createdAt // empty')
          if [ -n "$LATEST_SUCCESS_AT" ]; then
            LATEST_SUCCESS_SOFIA_DATE=$(TZ="Europe/Sofia" date -d "$LATEST_SUCCESS_AT" +%F)
            if [ "$LATEST_SUCCESS_SOFIA_DATE" = "$TODAY_SOFIA" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Bugün ($TODAY_SOFIA) zaten başarılı bir run var ($LATEST_SUCCESS_AT) — bu tetikleme atlanıyor."
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Bugün ($TODAY_SOFIA) henüz başarılı run yok — çalışacak."
  commqa:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30       # GAS'ta 6dk timeout vardı, burada 30dk sınır
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıkları kur
        run: pip install requests pytz google-auth google-auth-httplib2 google-api-python-client
      - name: CommQA çalıştır
        env:
          COMM100_SITE_ID:      ${{ secrets.COMM100_SITE_ID }}
          COMM100_API_KEY:      ${{ secrets.COMM100_API_KEY }}
          COMM100_EMAIL:        ${{ secrets.COMM100_EMAIL }}
          COMMQA_SPREADSHEET_ID: ${{ secrets.COMMQA_SPREADSHEET_ID }}
          GCP_CREDENTIALS:      ${{ secrets.GCP_CREDENTIALS }}
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAILS:        ${{ secrets.REPORT_EMAILS }}
        run: python scripts/commqa.py
