name: Poligon Chat Analyzer

on:
  schedule:
    - cron: '30 6 * * *'  # Her gün 08:30 Sofia (06:30 UTC yaz / 07:30 UTC kış)
  workflow_dispatch:        # Manuel çalıştırma butonu

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install requests pytz

      - name: Chat Analyzer çalıştır
        env:
          COMM100_SITE_ID:    ${{ secrets.COMM100_SITE_ID }}
          COMM100_API_KEY:    ${{ secrets.COMM100_API_KEY }}
          COMM100_EMAIL:      ${{ secrets.COMM100_EMAIL }}
          GEMINI_KEYS:        ${{ secrets.GEMINI_KEYS }}
          CLAUDE_KEY:         ${{ secrets.CLAUDE_KEY }}
          GROQ_KEYS:          ${{ secrets.GROQ_KEYS }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAILS:      ${{ secrets.REPORT_EMAILS }}
        run: python scripts/chat_analyzer.py
