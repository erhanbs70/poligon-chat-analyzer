name: VIP QA & AI Report
on:
  schedule:
    # Sofya 11:58 (birincil) — yaz saati (UTC+3, Nis-Eki yaklaşık): 08:58 UTC
    # NOT (4 Eyl 2026): dakika 30'dan 58'e kaydırıldı — GitHub Actions
    # saatin yuvarlak dakikalarında (00/15/30/45) yoğunluk yüzünden
    # scheduled run'ları saatlerce geciktirebiliyor, resmi tavsiyeleri
    # garip/yuvarlak-olmayan bir dakika kullanmak.
    - cron: '58 8 * 4-10 *'
    # Sofya 12:58 (yedek/retry) — yaz saati: 09:58 UTC
    - cron: '58 9 * 4-10 *'
    # Sofya 11:58 (birincil) — kış saati (UTC+2, Kas-Mar yaklaşık): 09:58 UTC
    - cron: '58 9 * 11,12,1,2,3 *'
    # Sofya 12:58 (yedek/retry) — kış saati: 10:58 UTC
    - cron: '58 10 * 11,12,1,2,3 *'
  workflow_dispatch:
    inputs:
      date:
        description: "Rapor tarihi (YYYY-MM-DD). Boş bırakılırsa dün (Sofia)."
        required: false
        default: ""
permissions:
  contents: read
  actions: read            # gh run list için gerekli
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Bugün zaten başarılı bir run var mı kontrol et
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          # DÜZELTME (4 Eyl 2026): bu job'da actions/checkout YOK, yani
          # çalışma dizininde .git yok — GH_REPO olmadan `gh run list`
          # hangi repo'da olduğunu bulamıyor ("not a git repository"
          # hatasıyla başarısız oluyordu, run #88'de görüldü).
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manuel tetikleme — doğrudan çalışacak."
            exit 0
          fi
          TODAY_SOFIA=$(TZ="Europe/Sofia" date +%F)
          LATEST_SUCCESS_AT=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --status success \
            --event schedule \
            --limit 5 \
            --json createdAt \
            --jq '.[0].createdAt // empty')
          if [ -n "$LATEST_SUCCESS_AT" ]; then
            LATEST_SUCCESS_SOFIA_DATE=$(TZ="Europe/Sofia" date -d "$LATEST_SUCCESS_AT" +%F)
            if [ "$LATEST_SUCCESS_SOFIA_DATE" = "$TODAY_SOFIA" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Bugün ($TODAY_SOFIA) zaten başarılı bir run var ($LATEST_SUCCESS_AT) — bu tetikleme atlanıyor."
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Bugün ($TODAY_SOFIA) henüz başarılı run yok — çalışacak."
  vip-report:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python kurulum
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıkları kur
        run: pip install requests pytz google-auth google-auth-httplib2 google-api-python-client
      - name: VIP QA Raporu çalıştır
        env:
          MR_SITE_ID:         ${{ secrets.MR_SITE_ID }}
          MR_API_KEY:         ${{ secrets.MR_API_KEY }}
          MR_EMAIL:           ${{ secrets.MR_EMAIL }}
          GEMINI_KEYS:        ${{ secrets.GEMINI_KEYS }}
          CLAUDE_KEY:         ${{ secrets.CLAUDE_KEY }}
          GROQ_KEYS:          ${{ secrets.GROQ_KEYS }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VIP_REPORT_EMAILS:  ${{ secrets.VIP_REPORT_EMAILS }}
          VIP_SPREADSHEET_ID: ${{ secrets.VIP_SPREADSHEET_ID }}
          GCP_CREDENTIALS:    ${{ secrets.GCP_CREDENTIALS }}
        run: python scripts/vip_qa_report.py "${{ github.event.inputs.date }}"
